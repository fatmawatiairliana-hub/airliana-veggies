<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AirLiana Veggies</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #2ecc71;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    display: flex;
    padding: 20px;
}

.products {
    flex: 3;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    background: white;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
}

button {
    background: #2ecc71;
    color: white;
    border: none;
    padding: 8px;
    cursor: pointer;
    margin-top: 5px;
}

.cart {
    flex: 1;
    background: white;
    padding: 15px;
    margin-left: 20px;
    border-radius: 10px;
}

.total {
    font-weight: bold;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🥦 AirLiana Veggies</h1>
    <p>Toko Sayur Segar Online</p>
</header>

<div class="container">

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1582515073490-dc8a3a7c47e8">
<h3>Bayam</h3>
<p>Rp 5.000</p>
<button onclick="addToCart('Bayam',5000)">Tambah</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1604908177522-0409f8d8a5f6">
<h3>Wortel</h3>
<p>Rp 7.000</p>
<button onclick="addToCart('Wortel',7000)">Tambah</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1587049352846-4a222e784d38">
<h3>Kangkung</h3>
<p>Rp 6.000</p>
<button onclick="addToCart('Kangkung',6000)">Tambah</button>
</div>

</div>

<div class="cart">
<h2>🛒 Keranjang</h2>
<ul id="cart-list"></ul>
<p class="total">Total: Rp <span id="total">0</span></p>

<button onclick="checkout()">Checkout via WhatsApp</button>
</div>

</div>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
    cart.push(name);
    total += price;

    let li = document.createElement("li");
    li.innerText = name + " - Rp " + price;
    document.getElementById("cart-list").appendChild(li);

    document.getElementById("total").innerText = total;
}

function checkout() {
    let pesan = "Halo, saya ingin pesan:%0A";
    cart.forEach(item => {
        pesan += "- " + item + "%0A";
    });
    pesan += "Total: Rp " + total;

    window.open("https://wa.me/6285780620013?text=" + pesan);
}
</script>

</body>
</html>
</html>
